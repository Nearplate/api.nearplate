# Runs the API with its own MongoDB and Redis. Config comes from `.env`
# (cp .env.example .env); the hostnames below override the localhost defaults.
# MongoDB and Redis are not published to the host, so this stack never clashes
# with local instances. Use test/docker-compose.yml for the e2e dependencies.
services:
  api:
    image: api-nearplate
    build: .
    restart: unless-stopped
    container_name: api_nearplate
    env_file: .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/api_nearplate
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${SERVER_APP_HTTP_PORT:-3000}:${SERVER_APP_HTTP_PORT:-3000}"
    networks:
      - api_nearplate_net
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: unless-stopped
    container_name: api_nearplate_mongo
    volumes:
      - api_nearplate_mongo_data:/data/db
    networks:
      - api_nearplate_net
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: api_nearplate_redis
    networks:
      - api_nearplate_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  api_nearplate_mongo_data:
    name: api_nearplate_mongo_data
    driver: local
networks:
  api_nearplate_net:
    name: api_nearplate_net
    driver: bridge
