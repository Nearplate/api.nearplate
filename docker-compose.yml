# Runs the API with its own Postgres and Redis. Config comes from `.env`
# (cp .env.example .env); the hostnames below override the localhost defaults.
# Postgres and Redis are not published to the host, so this stack never clashes
# with local instances. Use test/docker-compose.yml for the e2e dependencies.
services:
  api:
    image: api-nearplate
    build: .
    restart: unless-stopped
    container_name: api_nearplate
    env_file: .env
    environment:
      NODE_ENV: production
    ports:
      - "${SERVER_APP_HTTP_PORT:-8080}:${SERVER_APP_HTTP_PORT:-8080}"
    networks:
      - api_nearplate_net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    # PostGIS on top of Postgres 17; `imresamu/postgis` ships arm64 + amd64
    # images (the official `postgis/postgis` is amd64-only).
    image: imresamu/postgis:17-3.5
    restart: unless-stopped
    container_name: api_nearplate_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: api_nearplate
    volumes:
      - api_nearplate_postgres_data:/var/lib/postgresql/data
    networks:
      - api_nearplate_net
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    container_name: api_nearplate_redis
    networks:
      - api_nearplate_net
    volumes:
      - api_nearplate_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  api_nearplate_redis_data:
    name: api_nearplate_redis_data
    driver: local
  api_nearplate_postgres_data:
    name: api_nearplate_postgres_data
    driver: local
networks:
  api_nearplate_net:
    name: api_nearplate_net
    driver: bridge
